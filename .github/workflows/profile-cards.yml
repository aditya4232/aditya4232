name: Generate profile summary cards

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate cards
        uses: vn7n24fzkq/github-profile-summary-cards@release/v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEMES: "tokyonight"
          UTC_OFFSET: 5.5
