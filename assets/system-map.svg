<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Anatomy of an AI application</title><desc id="desc">Animated conceptual architecture. Knowledge flows from documents through chunking to a vector index. Queries retrieve context for model and tool orchestration, producing cited responses. Authentication, evaluation, and monitoring support the system.</desc>
